<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Admin Login | Polaris Consultants
    </title>

    <meta
        name="description"
        content="Polaris Consultants secure administration portal"
    >

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>


<body>

    <main class="login-page">

        <section class="login-card">


            <!-- LOGO -->

            <div class="logo-area">

                <div class="logo-circle">

                    <span>
                        PC
                    </span>

                </div>

                <h1>
                    POLARIS
                    <span>
                        CONSULTANTS
                    </span>
                </h1>

            </div>


            <!-- TITLE -->

            <div class="login-heading">

                <h2>
                    Admin Login
                </h2>

                <p>
                    Sign in to manage your
                    Polaris Consultants portal.
                </p>

            </div>


            <!-- LOGIN FORM -->

            <form
                id="loginForm"
                autocomplete="on"
            >


                <!-- EMAIL -->

                <div class="form-group">

                    <label
                        for="email"
                    >
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="admin@example.com"
                        autocomplete="username"
                        required
                    >

                    <small
                        class="error-message"
                        id="emailError"
                    ></small>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label
                        for="password"
                    >
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                    <small
                        class="error-message"
                        id="passwordError"
                    ></small>

                </div>


                <!-- REMEMBER -->

                <div class="login-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <span>
                            Remember me
                        </span>

                    </label>

                </div>


                <!-- MESSAGE -->

                <div
                    id="loginMessage"
                    class="login-message"
                    aria-live="polite"
                ></div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >

                    <span
                        id="loginButtonText"
                    >
                        Sign In
                    </span>

                    <span
                        id="loginLoader"
                        class="loader hidden"
                    >
                        Signing in...
                    </span>

                </button>


            </form>


            <!-- FOOTER -->

            <div class="login-footer">

                <a href="index.html">
                    ← Back to Website
                </a>

                <p>
                    ©
                    <span id="currentYear"></span>
                    Polaris Consultants
                </p>

            </div>


        </section>

    </main>


    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script
        src="supabase-config.js"
    ></script>

    <script
        src="login.js"
    ></script>

</body>

</html>
